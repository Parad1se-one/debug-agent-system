schema_version: debug_agent_system.config.v1
kg_root: data/kg
session_store: data/sessions_v2
knowledge:
  store: sqlite_sag_v2
  kg_v2_root: data/kg_v2
  kg_v2_sqlite_path: data/kg_v2_sag/debug_agent_v2.sqlite
  raw_root: data/raw/aoi_debug_agent_sources
  w1_root: data/results/w1_full_20260703_061455
retrieval:
  sag_max_hops: 1
  sag_event_budget: 150
  trace_enabled: true
  sag_degree_penalty: true
  sag_max_entity_degree: 240
  sag_family_canonicalization: true
  sag_llm_rerank: false
thresholds:
  graph_match_min_score: 4.0
  graph_match_min_margin: 0.75
  low_confidence: 0.35
  ask_info_max_required_items: 3
runtime:
  max_turns: 12
  destructive_action_requires_human_confirm: true
evidence_gap:
  enabled: true
  max_rounds: 2
  max_resources: 12
  max_bytes_per_resource: 65536
incident_runtime:
  # 结构化 Jira/诊断包旁路。默认关闭可保证 KG_v2 基线行为不变。
  enabled: false
  shadow_mode: true
  max_package_bytes: 536870912
  max_member_bytes: 33554432
  max_dump_member_bytes: 8589934592
  max_total_uncompressed_bytes: 1073741824
  max_members: 5000
  max_nesting: 3
  max_compression_ratio: 200
  allow_dump_analysis: false
  allow_ocr_analysis: false
read_llm:
  provider: codex
  enabled: false
  answer_composer_enabled: false
  model: gpt-5.3-codex
  # 留空时从项目根目录 .env.local 的 OPENAI_BASE_URL 读取。
  base_url: ""
  timeout_seconds: 60
  max_tool_rounds: 3
  max_answer_documents: 8
  max_answer_chunks: 64
  max_answer_input_chars: 60000
  answer_fallback: deterministic
